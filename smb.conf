[global]
   workgroup = WORKGROUP
   server string = OPL PS2 Samba Server
   netbios name = PS2SERVER
   security = user
   map to guest = Bad User
   guest account = nobody

   # OPL's SMB client predates SMB2/3 and modern signing/encryption.
   # Samba >= 4.11 disables SMB1 by default, which breaks OPL silently.
   server min protocol = NT1
   client min protocol = NT1
   server signing = disabled
   smb encrypt = disabled

   dns proxy = no
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   log file = /var/log/samba/log.%m
   max log size = 50
   logging = file

[PS2SMB]
   path = /games
   browseable = yes
   writable = yes
   guest ok = yes
   guest only = yes
   force user = ps2smb
   force group = ps2smb
   create mask = 0664
   directory mask = 0775
